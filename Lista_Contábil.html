<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Empresas Unificado</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  :root {
    --blue-dark: #1F4E78;
    --blue-header: #9DC3E6;
    --blue-light: #D9E8F5;
    --blue-bg: #EFF6FC;
    --missing: #FFF2CC;
    --border: #C9C9C9;
    --text: #23343F;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'Segoe UI', Roboto, Arial, sans-serif;
    background: var(--blue-bg);
    color: var(--text);
    padding: 24px;
  }
  .topbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 12px;
    margin-bottom: 16px;
  }
  h1 {
    font-size: 22px;
    margin: 0;
    color: var(--blue-dark);
  }
  .subtitle {
    font-size: 13px;
    color: #5A6B75;
    margin-top: 4px;
  }
  #downloadBtn {
    background: var(--blue-dark);
    color: #fff;
    border: none;
    padding: 12px 22px;
    font-size: 14px;
    font-weight: 600;
    border-radius: 8px;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 8px;
    box-shadow: 0 2px 6px rgba(31,78,120,0.25);
    transition: background 0.15s ease, transform 0.1s ease;
    white-space: nowrap;
  }
  #downloadBtn:hover { background: #163B5C; transform: translateY(-1px); }
  #downloadBtn:active { transform: translateY(0); }
  #downloadBtn svg { width: 16px; height: 16px; }

  /* ---- Filtro de busca ---- */
  .search-wrap {
    background: #fff;
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px 16px;
    margin-bottom: 18px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.05);
  }
  .search-wrap label {
    display: block;
    font-size: 12px;
    font-weight: 600;
    color: var(--blue-dark);
    margin-bottom: 6px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  #searchInput {
    width: 100%;
    padding: 10px 12px;
    font-size: 14px;
    border: 1px solid var(--border);
    border-radius: 8px;
    outline: none;
    color: var(--text);
  }
  #searchInput:focus {
    border-color: var(--blue-dark);
    box-shadow: 0 0 0 2px rgba(31,78,120,0.15);
  }
  #searchResults {
    margin-top: 10px;
  }
  .result-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 9px 12px;
    border-radius: 7px;
    background: var(--blue-bg);
    border: 1px solid var(--blue-light);
    margin-bottom: 6px;
    font-size: 13px;
  }
  .result-row .info { display: flex; flex-direction: column; gap: 2px; }
  .result-row .empresa { font-weight: 600; color: var(--text); }
  .result-row .meta { font-size: 12px; color: #5A6B75; }
  .result-row .responsavel {
    background: var(--blue-dark);
    color: #fff;
    padding: 4px 12px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: 700;
    white-space: nowrap;
  }
  .no-results {
    font-size: 13px;
    color: #5A6B75;
    padding: 6px 2px;
  }

  /* ---- Quadros ---- */
  .board-wrap {
    overflow-x: auto;
    padding-bottom: 14px;
    /* barra de rolagem horizontal sempre visivel e facil de arrastar */
    scrollbar-width: auto;
  }
  .board-wrap::-webkit-scrollbar {
    height: 14px;
  }
  .board-wrap::-webkit-scrollbar-track {
    background: var(--blue-light);
    border-radius: 8px;
  }
  .board-wrap::-webkit-scrollbar-thumb {
    background: var(--blue-header);
    border-radius: 8px;
    border: 2px solid var(--blue-light);
  }
  .board-wrap::-webkit-scrollbar-thumb:hover {
    background: var(--blue-dark);
  }
  .board {
    display: flex;
    gap: 18px;
    width: max-content;
  }
  .col {
    background: #fff;
    border-radius: 10px;
    overflow: hidden;
    width: 420px;
    flex: 0 0 420px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.06);
    border: 1px solid var(--border);
  }
  .col-header {
    background: var(--blue-header);
    color: var(--blue-dark);
    font-weight: 700;
    font-size: 15px;
    text-align: center;
    padding: 12px 10px;
    letter-spacing: 0.5px;
  }
  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
  }
  thead th {
    background: var(--blue-light);
    color: var(--blue-dark);
    font-weight: 600;
    text-align: left;
    padding: 8px 10px;
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 0;
    white-space: nowrap;
  }
  thead th.center { text-align: center; }
  tbody td {
    padding: 7px 10px;
    border-bottom: 1px solid #EEF2F5;
    vertical-align: top;
    white-space: nowrap;
  }
  tbody td.center { text-align: center; }
  tbody tr:nth-child(even) { background: #FAFCFE; }
  td.missing { background: var(--missing) !important; }
  .table-scroll {
    max-height: 70vh;
    overflow-y: auto;
  }
  .legend {
    margin-top: 4px;
    font-size: 12px;
    color: #5A6B75;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .legend span.swatch {
    width: 12px; height: 12px; background: var(--missing);
    display: inline-block; border-radius: 2px; border: 1px solid var(--border);
  }
</style>
</head>

function renderBoard() {
  const board = document.getElementById('board');
  ORDER.forEach(pessoa => {
    const lst = DATA[pessoa] || [];
    const col = document.createElement('div');
    col.className = 'col';

    const header = document.createElement('div');
    header.className = 'col-header';
    header.textContent = pessoa.toUpperCase() + ' (' + lst.length + ')';
    col.appendChild(header);

    const scrollWrap = document.createElement('div');
    scrollWrap.className = 'table-scroll';

    const table = document.createElement('table');
    table.innerHTML = '<thead><tr><th>Empresa</th><th class="center">CNPJ</th><th class="center">Enquadramento</th></tr></thead>';
    const tbody = document.createElement('tbody');

    lst.forEach(item => {
      const tr = document.createElement('tr');
      const missing = !item.cnpj;
      tr.innerHTML =
        '<td>' + escapeHtml(item.empresa) + '</td>' +
        '<td class="center' + (missing ? ' missing' : '') + '">' + escapeHtml(item.cnpj || '') + '</td>' +
        '<td class="center' + (missing ? ' missing' : '') + '">' + escapeHtml(item.enquadramento || '') + '</td>';
      tbody.appendChild(tr);
    });

    table.appendChild(tbody);
    scrollWrap.appendChild(table);
    col.appendChild(scrollWrap);
    board.appendChild(col);
  });
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function normalizeDigits(s) {
  return String(s).replace(/\D/g, '');
}

function handleSearch() {
  const raw = document.getElementById('searchInput').value.trim();
  const resultsDiv = document.getElementById('searchResults');
  resultsDiv.innerHTML = '';
  if (!raw) return;

  const term = raw.toLowerCase();
  const termDigits = normalizeDigits(raw);
  const isCnpjSearch = termDigits.length >= 4;

  const matches = [];
  ORDER.forEach(pessoa => {
    (DATA[pessoa] || []).forEach(item => {
      const nomeMatch = item.empresa.toLowerCase().includes(term);
      const cnpjMatch = isCnpjSearch && item.cnpj && normalizeDigits(item.cnpj).includes(termDigits);
      if (nomeMatch || cnpjMatch) {
        matches.push({ ...item, responsavel: pessoa });
      }
    });
  });

  if (matches.length === 0) {
    resultsDiv.innerHTML = '<div class="no-results">Nenhuma empresa encontrada.</div>';
    return;
  }

  matches.slice(0, 30).forEach(m => {
    const row = document.createElement('div');
    row.className = 'result-row';
    row.innerHTML =
      '<div class="info">' +
        '<span class="empresa">' + escapeHtml(m.empresa) + '</span>' +
        '<span class="meta">' + escapeHtml(m.cnpj || 'CNPJ não localizado') + (m.enquadramento ? ' · ' + escapeHtml(m.enquadramento) : '') + '</span>' +
      '</div>' +
      '<span class="responsavel">' + escapeHtml(m.responsavel) + '</span>';
    resultsDiv.appendChild(row);
  });

  if (matches.length > 30) {
    const more = document.createElement('div');
    more.className = 'no-results';
    more.textContent = '+ ' + (matches.length - 30) + ' resultado(s) adicional(is). Refine a busca.';
    resultsDiv.appendChild(more);
  }
}

function baixarPlanilha() {
  const wb = XLSX.utils.book_new();
  const wsData = [];
  const blockWidth = 3;
  const gap = 1;
  const maxRows = Math.max(...ORDER.map(p => (DATA[p] || []).length)) + 2;

  for (let r = 0; r < maxRows; r++) {
    wsData.push(new Array(ORDER.length * (blockWidth + gap)).fill(''));
  }

  ORDER.forEach((pessoa, idx) => {
    const lst = DATA[pessoa] || [];
    const colStart = idx * (blockWidth + gap);
    wsData[0][colStart] = pessoa.toUpperCase();
    wsData[1][colStart] = 'Empresa';
    wsData[1][colStart + 1] = 'CNPJ';
    wsData[1][colStart + 2] = 'Enquadramento Federal';
    lst.forEach((item, i) => {
      wsData[2 + i][colStart] = item.empresa;
      wsData[2 + i][colStart + 1] = item.cnpj;
      wsData[2 + i][colStart + 2] = item.enquadramento;
    });
  });

  const ws = XLSX.utils.aoa_to_sheet(wsData);

  ws['!merges'] = ORDER.map((_, idx) => {
    const colStart = idx * (blockWidth + gap);
    return { s: { r: 0, c: colStart }, e: { r: 0, c: colStart + 2 } };
  });

  const cols = [];
  ORDER.forEach(() => {
    cols.push({ wch: 50 }, { wch: 20 }, { wch: 20 }, { wch: 3 });
  });
  ws['!cols'] = cols;

  XLSX.utils.book_append_sheet(wb, ws, 'Empresas');
  XLSX.writeFile(wb, 'Empresas_Unificado.xlsx');
}
